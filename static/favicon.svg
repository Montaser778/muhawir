<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Muhawir">
  <rect width="64" height="64" rx="14" fill="#0a0b0d"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#23272e" stroke-width="1.5"/>

  <!-- Two voices meeting on one baseline, same motif as the full mark -->
  <line x1="12" y1="40" x2="52" y2="40" stroke="#2b3038" stroke-width="1.5"/>

  <g fill="#4dd8e6">
    <rect x="10" y="32" width="5" height="8" rx="2.5"/>
    <rect x="18" y="24" width="5" height="16" rx="2.5"/>
    <rect x="26" y="14" width="5" height="26" rx="2.5"/>
  </g>

  <g fill="#ffb627">
    <rect x="49" y="32" width="5" height="8" rx="2.5"/>
    <rect x="41" y="24" width="5" height="16" rx="2.5"/>
    <rect x="33" y="14" width="5" height="26" rx="2.5"/>
  </g>

  <circle cx="32" cy="40" r="4" fill="#0a0b0d" stroke="#e6e8eb" stroke-width="2"/>
</svg>
