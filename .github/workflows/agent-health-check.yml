name: Agent health check

# Runs entirely independent of server.py / Fly — see
# scripts/check_agent_health.py for why. 5 minutes is GitHub Actions'
# minimum practical schedule granularity; scheduled runs can also be
# delayed under platform load, which is fine here since the script itself
# requires 2 consecutive unhealthy reads before alerting.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write # required for `gh variable set/get` (cross-run state)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check agent health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPECAT_TOKEN: ${{ secrets.PIPECAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_agent_health.py
