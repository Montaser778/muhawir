app = "muhawir"
primary_region = "fra"

[build]

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "udp"
  internal_port = 7860
  processes = ["app"]

  [[services.ports]]
    port = 7860

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
